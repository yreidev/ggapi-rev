name: Publish Docker image (manual branch)

# Manual branch → GHCR under branch-* tags only (test images before a release).
# Never overwrites formal release tags (v*.N) or :latest.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to build (must be refs/heads/*; e.g. main, alpha). Not a release tag."
        required: true
        type: string

concurrency:
  group: ghcr-branch-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Docker tags
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.version.outputs.branch }}
      sha: ${{ steps.version.outputs.sha }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch }}

      - name: Resolve Docker tags
        id: version
        env:
          BRANCH_NAME: ${{ inputs.branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Normalize documented form refs/heads/<name>
          case "$BRANCH_NAME" in
            refs/heads/*) BRANCH_NAME="${BRANCH_NAME#refs/heads/}" ;;
          esac

          # Must be a real branch head only (reject tags, SHAs, other refs)
          if git show-ref --verify --quiet "refs/tags/${BRANCH_NAME}"; then
            echo "::error::Refusing tag name as branch input; use docker-build.yml for release tags"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/heads/${BRANCH_NAME}" \
            && ! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH_NAME}"; then
            echo "::error::Ref is not a branch head (refs/heads/* or origin/*)"
            exit 1
          fi

          case "$BRANCH_NAME" in
            latest|LATEST)
              echo "::error::Refusing branch name latest (would collide with production alias)"
              exit 1
              ;;
          esac
          if printf '%s' "$BRANCH_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Refusing version-like branch name; use a non-v* branch"
            exit 1
          fi

          SAFE=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          SAFE=${SAFE:0:60}
          SAFE=$(printf '%s' "$SAFE" | sed -E 's/[.-]+$//')
          if [ -z "$SAFE" ]; then
            echo "::error::Branch cannot be converted to a valid Docker tag fragment"
            exit 1
          fi

          # Hash original branch name so feature/foo vs feature-foo cannot collide
          NAME_HASH=$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-8)

          # Namespace: never collide with formal release tags or :latest
          IMAGE_TAG="branch-${SAFE}-${NAME_HASH}"
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${IMAGE_TAG}-$(date +'%Y%m%d')-${SHORT_SHA}"
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          case "$IMAGE" in
            *calciumion/new-api*|docker.io/calciumion/*)
              echo "::error::Refusing upstream Docker Hub image namespace: $IMAGE"
              exit 1
              ;;
          esac

          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Prepared GHCR branch image ${IMAGE}:${IMAGE_TAG} / ${IMAGE}:${VERSION}"

  build_amd64:
    name: Build & push (amd64)
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Write VERSION
        run: |
          echo "${{ needs.prepare.outputs.version }}" > VERSION
          echo "Publishing ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }} for amd64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Build & push amd64
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # GHA cache backend can return HTML error pages; do not fail a successful push
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes "${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Output digest
        run: |
          {
            echo "### GHCR image (amd64, branch-*)"
            echo '```'
            echo "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}"
            echo "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
